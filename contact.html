<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact — Adrián Birnbaun</title>
  <meta name="description" content="Contact Adrián Birnbaun, graphic, digital, web and UX/UI designer based in Buenos Aires.">
  <meta name="theme-color" content="#050505">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=JetBrains+Mono:wght@400&display=swap">

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="contact-page page">
  <header class="site-header page-header contact-header">
    <span class="site-name">Adrián Birnbaun</span>
    <a class="page-close contact-close" href="index.html" aria-label="Close contact page and return to home">[ ESC / CLOSE ]</a>
  </header>

  <main class="page-main contact-main" id="main">
    <section class="contact-intro" aria-labelledby="contact-title">
      <p class="contact-kicker">Contact /</p>
      <h1 id="contact-title">Get in touch</h1>
    </section>

    <section class="contact-grid" aria-label="Contact details">
      <div class="contact-copy">
        <p class="contact-label">Available for selected projects</p>
        <p class="contact-description">Graphic, digital, web and UX/UI design for ideas that need a clear point of view.</p>
      </div>

      <div class="contact-details">
        <div class="contact-detail">
          <p class="contact-label">Email</p>
          <a class="contact-link contact-link--email" href="mailto:adbgtrabajo@gmail.com">adbgtrabajo@gmail.com <span aria-hidden="true">↗</span></a>
        </div>

        <div class="contact-detail">
          <p class="contact-label">Elsewhere</p>
          <a class="contact-link" href="https://www.linkedin.com/in/adri%C3%A1n-birnbaun-4425608b/" target="_blank" rel="noopener">LinkedIn <span aria-hidden="true">↗</span></a>
          <a class="contact-link" href="https://www.instagram.com/bias.corner/" target="_blank" rel="noopener">Instagram <span aria-hidden="true">↗</span></a>
        </div>
      </div>

      <figure class="contact-image">
        <img class="contact-image__photo" src="assets/contact-phone.jpg" alt="A hand holding a pink retro telephone handset against a blue backdrop" width="1024" height="1536" loading="lazy">
        <figcaption>Call me / maybe</figcaption>
      </figure>
    </section>

    <footer class="contact-footer">
      <p class="contact-footer__links"><span>Adrián Birnbaun</span> / Contact</p>
      <p class="contact-mark" aria-label="Copyright 2026">© <span>26</span></p>
    </footer>
  </main>

  <canvas class="grain" aria-hidden="true"></canvas>

  <script src="js/main.js" defer></script>
</body>
</html>
